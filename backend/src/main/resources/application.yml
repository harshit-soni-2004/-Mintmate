server:
  port: 8080

spring:
  application:
    name: mintmate-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spendsense?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Harshit#$04}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.spendsense: INFO
    org.springframework.security: WARN

spendsense:
  categorization:
    ml:
      enabled: ${ML_CATEGORIZATION_ENABLED:true}
      artifact-path: ${ML_MODEL_ARTIFACT_PATH:classpath:model/baseline_model_v1.json}
    semantic:
      enabled: ${SEMANTIC_CATEGORIZATION_ENABLED:false}
      artifact-path: ${SEMANTIC_MODEL_ARTIFACT_PATH:classpath:model/semantic_classifier_v1.json}
      onnx-path: ${SEMANTIC_ONNX_PATH:ml/models/semantic_v1/minilm_l6_v2.onnx}
      vocab-path: ${SEMANTIC_VOCAB_PATH:classpath:model/minilm_vocab.txt}
      escalation-threshold: ${SEMANTIC_ESCALATION_THRESHOLD:0.60}
    hybrid:
      enabled: ${HYBRID_CATEGORIZATION_ENABLED:false}
      artifact-path: ${HYBRID_MODEL_ARTIFACT_PATH:classpath:model/hybrid_model_v1.json}
    policy:
      high-threshold: ${CATEGORIZATION_HIGH_THRESHOLD:0.85}
      medium-threshold: ${CATEGORIZATION_MEDIUM_THRESHOLD:0.60}
  storage:
    local-dir: ${SPENDSENSE_STORAGE_LOCAL_DIR:./data/documents}
  assistant:
    provider: ${ASSISTANT_PROVIDER:gemini}
    model: ${ASSISTANT_MODEL:gemini-2.5-flash}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${ASSISTANT_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-ms: ${ASSISTANT_TIMEOUT_MS:30000}


