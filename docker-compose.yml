services:
  mysql:
    image: mysql:8.4
    container_name: spendsense-mysql
    environment:
      MYSQL_DATABASE: spendsense
      MYSQL_USER: spendsense
      MYSQL_PASSWORD: spendsense
      MYSQL_ROOT_PASSWORD: spendsense
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - spendsense_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  spendsense_mysql:
