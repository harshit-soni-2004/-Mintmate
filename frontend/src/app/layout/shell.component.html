<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">S</span>
      <div>
        <strong>SpendSense</strong>
        <small>Your money, made clearer</small>
      </div>
    </div>
    <nav>
      <a routerLink="/app/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/app/transactions" routerLinkActive="active">Transactions</a>
      <a routerLink="/app/statements" routerLinkActive="active">Statements</a>
      <a routerLink="/app/budgets" routerLinkActive="active">Budgets</a>
      <a routerLink="/app/goals" routerLinkActive="active">Goals</a>
      <a routerLink="/app/insights" routerLinkActive="active">Insights</a>
      <a routerLink="/app/settings" routerLinkActive="active">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user">
        <span class="avatar">{{ (auth.currentUser()?.displayName || 'U').charAt(0) }}</span>
        <div>
          <strong>{{ auth.currentUser()?.displayName }}</strong>
          <small>{{ auth.currentUser()?.email }}</small>
        </div>
      </div>
      <button type="button" class="linkish" (click)="auth.logout()">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
  <nav class="mobile-nav">
    <a routerLink="/app/dashboard" routerLinkActive="active">Home</a><a routerLink="/app/transactions" routerLinkActive="active">Activity</a><a routerLink="/app/statements" routerLinkActive="active">Statements</a><a routerLink="/app/budgets" routerLinkActive="active">Budgets</a><a routerLink="/app/goals" routerLinkActive="active">Goals</a><a routerLink="/app/settings" routerLinkActive="active">Profile</a>
  </nav>
</div>
