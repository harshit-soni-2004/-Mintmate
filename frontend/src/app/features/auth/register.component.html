<section class="auth-page">
  <div class="panel">
    <p class="eyebrow">SpendSense</p>
    <h1>Create account</h1>
    <p class="lede">Start with a private workspace for your finances.</p>

    @if (errorMessage) {
      <div class="alert" role="alert">{{ errorMessage }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Name
        <input type="text" formControlName="displayName" autocomplete="name" />
      </label>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating account…' : 'Create account' }}
      </button>
    </form>
    <p class="switch">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
